<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Илья | Cyberpunk Portfolio</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('background.jpg') no-repeat center center/cover;
      color: white;
    }

    /* затемнение фона */
    .overlay {
      background: rgba(0, 0, 0, 0.7);
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 60px 20px;
      text-align: center;
    }

    h1 {
      font-size: 60px;
      color: #00ffcc;
      text-shadow: 0 0 20px #00ffcc;
    }

    p {
      font-size: 18px;
      color: #ccc;
    }

    h2 {
      margin-top: 60px;
      color: #ff00ff;
      text-shadow: 0 0 10px #ff00ff;
    }

    /* кнопки */
    .btn {
      display: inline-block;
      margin: 10px;
      padding: 12px 20px;
      border: 2px solid #00ffcc;
      border-radius: 10px;
      color: #00ffcc;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn:hover {
      background: #00ffcc;
      color: black;
      box-shadow: 0 0 15px #00ffcc;
    }

    /* навыки */
    .skill {
      display: inline-block;
      margin: 6px;
      padding: 8px 14px;
      border: 1px solid #00ffcc;
      border-radius: 10px;
      color: #00ffcc;
      box-shadow: 0 0 10px rgba(0,255,204,0.5);
    }

    /* карточки */
    .card {
      display: block;
      margin: 20px 0;
      padding: 20px;
      border-radius: 15px;
      text-decoration: none;
      color: white;
      border: 1px solid #ff00ff;
      transition: 0.3s;
      background: rgba(0,0,0,0.5);
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px #ff00ff;
    }

    .card-title {
      font-size: 22px;
      color: #00ffcc;
    }

    .card-desc {
      color: #aaa;
    }

  </style>
</head>

<body>
  <div class="overlay">
    <div class="container">

        <span class="skill">SQL</span>
        <span class="skill">Linux</span>
        <span class="skill">Git</span>
        <span class="skill">Data Analysis</span>
      </div>

      <h2>Проекты</h2>

      <a href="https://github.com/iluhamusic/iluhamusic" class="card">
        <div class="card-title">iluhamusic</div>
        <div class="card-desc">
          Linux, терминал, архитектура ЭВМ
        </div>
      </a>

      <h2>Контакты</h2>
      <p>Email: 2006.11.09kimilya@gmail.com</p>

    </div>
  </div>
</body>
