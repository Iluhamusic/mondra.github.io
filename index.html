<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Илья | Cyberpunk Portfolio</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: url('background.jpg') no-repeat center center/cover;
      color: white;
    }

    /* затемнение + градиент */
    .overlay {
      min-height: 100vh;
      background: linear-gradient(
        rgba(5, 5, 10, 0.9),
        rgba(10, 0, 20, 0.9)
      );
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 80px 20px;
      text-align: center;
      animation: fadeIn 1.5s ease;
    }

    /* АНИМАЦИЯ */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ИМЯ */
    h1 {
      font-size: 64px;
      margin-bottom: 10px;
      color: #00ffcc;
      text-shadow:
        0 0 10px #00ffcc,
        0 0 20px #00ffcc,
        0 0 40px #00ffcc;
    }

    p {
      font-size: 18px;
      color: #ccc;
    }

    h2 {
      margin-top: 60px;
      color: #ff00ff;
      text-shadow: 0 0 10px #ff00ff;
    }

    /* КНОПКИ */
    .btn {
      display: inline-block;
      margin: 10px;
      padding: 12px 22px;
      border-radius: 12px;
      border: 1px solid #00ffcc;
      color: #00ffcc;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.1);
      background: #00ffcc;
      color: black;
      box-shadow:
        0 0 10px #00ffcc,
        0 0 20px #00ffcc;
    }

    /* НАВЫКИ */
    .skills {
      margin-top: 20px;
    }

    .skill {
      display: inline-block;
      margin: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid #00ffcc;
      color: #00ffcc;
      box-shadow: 0 0 10px rgba(0,255,204,0.5);
    }

    /* ПРОЕКТЫ */
    .card {
      display: block;
      margin: 25px 0;
      padding: 25px;
      border-radius: 20px;
      text-decoration: none;
      color: white;

      background: rgba(20, 20, 40, 0.5);
      backdrop-filter: blur(12px);

      border: 1px solid rgba(255, 0, 255, 0.5);
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(255, 0, 255, 0.8);
    }

    .card-title {
      font-size: 22px;
      color: #00ffcc;
      margin-bottom: 5px;
    }

    .card-desc {
      color: #aaa;
    }

    /* КОНТАКТЫ */
    .contacts {
      margin-top: 40px;
    }

  </style>
</head>

<body>

  <div class="overlay">
    <div class="container">

      <h1>Илья</h1>
      <p>Студент РУДН | Python | Анализ данных</p>

      <div>
        <a href="https://github.com/iluhamusic" class="btn">GitHub</a>
        <a href="mailto:2006.11.09kimilya@gmail.com" class="btn">Email</a>
      </div>

      <h2>Навыки</h2>
      <div class="skills">
        <span class="skill">Python</span>
        <span class="skill">SQL</span>
        <span class="skill">Linux</span>
        <span class="skill">Git</span>
        <span class="skill">Data Analysis</span>
      </div>

      <h2>Проекты</h2>

      <a href="https://github.com/iluhamusic/iluhamusic" class="card">
        <div class="card-title">iluhamusic</div>
        <div class="card-desc">
          Практика: Linux, терминал, архитектура ЭВМ
        </div>
      </a>

      <div class="contacts">
        <h2>Контакты</h2>
        <p>Email: 2006.11.09kimilya@gmail.com</p>
        <p>Телефон: +7 (928) 451-94-05</p>
      </div>

    </div>
  </div>

</body>
</html>
